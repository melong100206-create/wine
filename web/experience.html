<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체험농장 · 송산언덕 포도원</title>
<meta name="description" content="회당 여섯 분만 모시는 프라이빗 빈야드 테이스팅과 수확 동행 프로그램.">
<meta name="theme-color" content="#0D0D0D">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/consumer.css">
</head>
<body data-base="./">

<header class="page-head wrap">
  <div class="breadcrumb"><a href="index.html">HOME</a> · EXPERIENCE</div>
  <div class="sec-head split" style="margin-bottom:0">
    <div class="stack-sm">
      <h1 class="t-h1">초청</h1>
      <p>관광 프로그램이 아니라, 포도원에 손님을 들이는 일입니다. 회차마다 인원을 제한합니다.</p>
    </div>
  </div>
</header>

<section class="wrap" style="padding-top:clamp(40px,5vw,72px)">
  <div class="frame wide" id="farm-shot" data-reveal></div>
</section>

<section class="section wrap">
  <div class="sec-head"><span class="eyebrow">Programs</span><h2 class="t-h2">세 가지 방문</h2></div>
  <div class="program" id="programs"></div>
</section>

<section class="section wrap">
  <div class="invite" data-reveal>
    <div class="invite-grid">
      <div class="stack">
        <span class="eyebrow">Reservation</span>
        <h2 class="t-h2">예약 요청</h2>
        <p class="muted small" style="max-width:46ch">
          요청을 남겨 주시면 가능한 회차를 문자로 안내드립니다. 결제는 일정 확정 후 진행됩니다.
          주류 시음이 포함된 프로그램은 만 19세 이상만 참여할 수 있으며, 차량 운전자에게는 시음을 제공하지 않습니다.
        </p>
      </div>
      <form class="stack" id="resv">
        <div class="field"><label for="p">프로그램</label><select id="p"></select></div>
        <div class="field-row">
          <div class="field"><label for="d">희망 날짜</label><input id="d" type="date"></div>
          <div class="field"><label for="n">인원</label><input id="n" class="num" inputmode="numeric" value="2"></div>
        </div>
        <div class="field"><label for="c">연락처</label><input id="c" class="num" placeholder="010-0000-0000"></div>
        <button class="btn btn-gold btn-block" id="send">예약 요청 보내기</button>
      </form>
    </div>
  </div>
</section>

<script src="assets/js/data.js"></script>
<script src="assets/js/card.js"></script>
<script src="assets/js/site.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var S = window.SONGSAN;

  document.getElementById('farm-shot').innerHTML =
    S.img('farm-tour', 'scene-farm.svg', '포도밭 테이스팅 테이블') +
    '<span class="caption">해질녘 · 포도밭 테이스팅 테이블</span>';

  document.getElementById('programs').innerHTML = S.programs.map(function (p, i) {
    return '<article data-reveal data-delay="' + (i + 1) + '">' +
      '<span class="p-variety">' + p.en + '</span>' +
      '<h3 class="t-h3">' + p.name + '</h3>' +
      '<div class="pr-price num">' + S.won(p.price) + '원 <span class="dim" style="font-size:12px">/ ' + p.unit + '</span></div>' +
      '<ul>' + p.items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' +
      '<div class="row between" style="border-top:1px solid var(--line);padding-top:16px">' +
        '<span class="dim xsmall">' + p.cap + '</span><span class="dim xsmall num">' + p.dur + '</span>' +
      '</div>' +
    '</article>';
  }).join('');

  document.getElementById('p').innerHTML = S.programs.map(function (p) {
    return '<option value="' + p.id + '">' + p.name + '</option>';
  }).join('');

  document.getElementById('send').addEventListener('click', function (e) {
    e.preventDefault();
    if (!document.getElementById('c').value.trim() || !document.getElementById('d').value) {
      S.toast('날짜와 연락처를 입력해 주세요'); return;
    }
    S.toast('예약 요청이 접수되었습니다 · 확인 후 문자로 안내드립니다');
    document.getElementById('resv').reset();
  });

  S.reveal();
});
</script>
</body>
</html>
