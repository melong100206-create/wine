<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 · 송산언덕 포도원</title>
<meta name="theme-color" content="#0D0D0D">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/consumer.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/icon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/icon/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="송산언덕">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js" defer></script>
</head>
<body data-base="./">

<header class="page-head wrap">
  <div class="breadcrumb"><a href="cart.html">CART</a> · ORDER</div>
  <h1 class="t-h1">주문</h1>
</header>

<main class="section wrap">
  <div class="stepper">
    <div aria-current="step"><span class="s-n">01</span> 배송 정보</div>
    <div><span class="s-n">02</span> 결제</div>
    <div><span class="s-n">03</span> 완료</div>
  </div>

  <form class="cart-layout" id="order-form" novalidate>
    <div class="stack-lg">
      <div id="auth-hint"></div>

      <section class="stack">
        <span class="eyebrow">Recipient</span>
        <div class="field-row">
          <div class="field"><label for="name">주문자</label><input id="name" required autocomplete="name"></div>
          <div class="field"><label for="tel">휴대전화</label><input id="tel" class="num" required inputmode="tel" placeholder="010-0000-0000"></div>
        </div>
        <div class="field"><label for="email">이메일 (주문 내역 발송)</label><input id="email" type="email" required autocomplete="email"></div>
        <div class="addr-search">
          <div class="field"><label for="zip">우편번호</label><input id="zip" class="num" required inputmode="numeric" readonly></div>
          <button class="btn btn-sm" id="find-addr" type="button">주소 검색</button>
        </div>
        <div class="field"><label for="addr">도로명 주소</label><input id="addr" required autocomplete="street-address" readonly></div>
        <div class="field"><label for="addr2">상세 주소</label><input id="addr2" autocomplete="address-line2" placeholder="동·호수 등"></div>
        <div class="field"><label for="memo">배송 메모</label>
          <select id="memo">
            <option>부재 시 전화 부탁드립니다</option>
            <option>파손 주의 — 문 앞에 두지 마세요</option>
            <option>공동현관 비밀번호 입력 후 배송</option>
          </select>
        </div>
        <p class="dim xsmall">주류는 문 앞 배송이 불가하며, 성인 수령인에게 신분증 확인 후 직접 전달됩니다.</p>
      </section>

      <section class="stack">
        <span class="eyebrow">Payment</span>
        <div class="pay-opts">
          <label class="pay-opt"><input type="radio" name="pay" value="card" checked> <span>신용·체크카드</span></label>
          <label class="pay-opt"><input type="radio" name="pay" value="kakao"> <span>카카오페이</span></label>
          <label class="pay-opt"><input type="radio" name="pay" value="naver"> <span>네이버페이</span></label>
          <label class="pay-opt"><input type="radio" name="pay" value="bank"> <span>계좌이체 (무통장)</span></label>
        </div>
        <p class="dim xsmall">프로토타입에서는 실제 결제가 일어나지 않습니다. 실제 구축 시 PG(토스페이먼츠·KG이니시스 등) 인증 결제창이 이 자리에 다크 테마로 연동됩니다.</p>
      </section>

      <section class="stack">
        <span class="eyebrow">Agreement</span>
        <label class="check"><input type="checkbox" id="ag-age" required>
          <span>만 19세 이상이며, 성인 수령 확인 절차에 동의합니다. <b>(필수)</b></span></label>
        <label class="check"><input type="checkbox" id="ag-term" required>
          <span>주문 내용을 확인했으며 구매 조건 및 개인정보 수집·이용(배송·주문 처리 목적)에 동의합니다. <b>(필수)</b></span></label>
        <label class="check"><input type="checkbox" id="ag-mkt">
          <span>다음 회차 출고 소식을 문자로 받겠습니다. (선택)</span></label>
      </section>
    </div>

    <aside class="summary" id="summary"></aside>
  </form>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/card.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/site.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var S = window.SONGSAN;
  var t = S.Cart.totals();

  if (!t.rows.length) {
    document.getElementById('order-form').outerHTML =
      '<div class="empty"><h2 class="t-h2">주문할 상품이 없습니다</h2>' +
      '<a class="btn btn-primary" href="products.html">와인 보러 가기</a></div>';
    return;
  }

  S.bindAddressSearch({ button: 'find-addr', zip: 'zip', addr: 'addr', detail: 'addr2' });

  /* 세션 복원을 기다렸다가, 로그인 상태면 저장된 배송 정보를 채운다 */
  await S.Auth.ready;
  var me = S.Auth.current();
  var hint = document.getElementById('auth-hint');
  if (me) {
    [['name','name'],['tel','tel'],['email','email'],['zip','zip'],['addr','addr'],['addr2','addr2']]
      .forEach(function (pair) {
        var el = document.getElementById(pair[0]);
        if (el && !el.value && me[pair[1]]) el.value = me[pair[1]];
      });
    hint.innerHTML =
      '<div class="auth-msg ok" style="margin-bottom:8px">' + me.name + ' 님으로 주문합니다. ' +
      '저장된 배송 정보를 불러왔습니다. · <a href="account.html" style="text-decoration:underline">마이페이지</a></div>';
  } else {
    hint.innerHTML =
      '<div class="auth-msg ok" style="margin-bottom:8px">' +
      '<a href="login.html?next=checkout.html" style="text-decoration:underline">로그인</a> 하시면 배송 정보가 자동으로 채워지고 ' +
      '주문 내역이 저장됩니다. 비회원으로도 주문하실 수 있습니다.</div>';
  }

  document.getElementById('summary').innerHTML =
    '<span class="eyebrow">Order Summary</span>' +
    '<div style="margin-top:24px">' +
      t.rows.map(function (r) {
        return '<div class="sum-row"><span>' + r.product.name + ' <span class="num dim">×' + r.qty + '</span></span>' +
               '<span class="num">' + S.won(r.line) + '원</span></div>';
      }).join('') +
      '<div class="sum-row"><span>배송비</span><span class="num">' + (t.ship ? S.won(t.ship) + '원' : '무료') + '</span></div>' +
      '<div class="sum-row total"><span>결제 금액</span><span class="num">' + S.won(t.total) + '원</span></div>' +
    '</div>' +
    '<button class="btn btn-primary btn-block" id="pay" style="margin-top:28px">' + S.won(t.total) + '원 결제하기</button>' +
    '<p class="dim xsmall" style="margin-top:18px">' + S.ddayText() + ' · 출고 후 1–2일 내 도착</p>';

  document.getElementById('pay').addEventListener('click', async function (e) {
    e.preventDefault();
    var form = document.getElementById('order-form');
    var required = ['name', 'tel', 'email', 'zip', 'addr'];
    var missing = required.filter(function (id) { return !document.getElementById(id).value.trim(); });
    if (missing.length) {
      S.toast('배송 정보를 모두 입력해 주세요');
      document.getElementById(missing[0]).focus();
      return;
    }
    if (!document.getElementById('ag-age').checked || !document.getElementById('ag-term').checked) {
      S.toast('필수 동의 항목을 확인해 주세요');
      return;
    }
    var order = {
      no: 'SH' + (function (d) {  /* UTC 가 아니라 한국 현지 날짜 기준 */
        return String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
      })(new Date()) + '-' + String(Math.floor(Math.random() * 9000) + 1000),
      name: document.getElementById('name').value.trim(),
      total: t.total,
      bottles: t.bottles,
      ship: S.nextShipDate
    };
    try { sessionStorage.setItem('songsan.lastOrder', JSON.stringify(order)); } catch (err) {}

    /* 로그인 상태면 주문을 계정에 기록하고 배송지를 갱신한다 (비회원은 건너뛴다) */
    if (me) {
      var btn = document.getElementById('pay');
      btn.disabled = true; btn.textContent = '주문 접수 중…';
      try {
        await S.Auth.addOrder({
          no: order.no,
          total: t.total,
          bottles: t.bottles,
          summary: t.rows.map(function (r) { return r.product.name + ' ×' + r.qty; }).join(', '),
          shipDate: S.nextShipDate,
          status: '결제완료',
          recipient: {
            name: document.getElementById('name').value.trim(),
            tel: document.getElementById('tel').value.trim(),
            zip: document.getElementById('zip').value.trim(),
            addr: document.getElementById('addr').value.trim(),
            addr2: document.getElementById('addr2').value.trim(),
            memo: document.getElementById('memo').value
          }
        });
        await S.Auth.update({
          tel: document.getElementById('tel').value.trim(),
          zip: document.getElementById('zip').value.trim(),
          addr: document.getElementById('addr').value.trim(),
          addr2: document.getElementById('addr2').value.trim()
        });
      } catch (err) {
        S.toast('주문 기록에 실패했습니다: ' + err.message);
      }
    }
    S.Cart.clear();
    location.href = 'order-complete.html';
  });
});
</script>
</body>
</html>
