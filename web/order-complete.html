<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 완료 · 송산언덕 포도원</title>
<meta name="theme-color" content="#0D0D0D">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/consumer.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/icon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/icon/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="송산언덕">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body data-base="./">

<main class="done wrap">
  <div id="done"></div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/card.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/site.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var S = window.SONGSAN;
  var o = null;
  try { o = JSON.parse(sessionStorage.getItem('songsan.lastOrder')); } catch (e) {}

  if (!o) {
    document.getElementById('done').innerHTML =
      '<h1 class="t-h2">최근 주문 내역이 없습니다</h1>' +
      '<p class="muted small" style="margin:18px 0 32px">주문을 완료하면 이 화면에서 확인하실 수 있습니다.</p>' +
      '<a class="btn btn-primary" href="products.html">와인 보러 가기</a>';
    return;
  }

  var d = new Date(o.ship + 'T00:00:00');
  document.getElementById('done').innerHTML =
    '<div class="seal">✓</div>' +
    '<span class="eyebrow center" style="justify-content:center">Order Confirmed</span>' +
    '<h1 class="t-h1" style="margin:26px 0 20px">' + o.name + ' 님,<br>주문이 접수되었습니다</h1>' +
    '<p class="muted" style="max-width:42ch;margin-inline:auto">' +
      '와인 ' + o.bottles + '병 · 결제 <span class="num">' + S.won(o.total) + '</span>원.<br>' +
      (d.getMonth() + 1) + '월 ' + d.getDate() + '일 회차에 병입해 당일 출고합니다.' +
    '</p>' +
    '<div class="row" style="justify-content:center;gap:12px;margin-top:20px">' +
      '<span class="badge">주문번호 ' + o.no + '</span>' +
    '</div>' +
    '<div class="row" style="justify-content:center;gap:14px;margin-top:44px;flex-wrap:wrap">' +
      (S.Auth.current()
        ? '<a class="btn btn-gold" href="account.html">주문 내역 보기</a>'
        : '<a class="btn btn-gold" href="login.html?tab=signup">가입하고 주문 내역 저장하기</a>') +
      '<a class="btn" href="experience.html">체험농장 초청받기</a>' +
      '<a class="btn" href="index.html">홈으로</a>' +
    '</div>' +
    '<p class="dim xsmall" style="margin-top:38px;max-width:44ch;margin-inline:auto">' +
      '주문 확인 문자와 이메일이 발송됩니다. 수령 시 성인 신분증 확인 절차가 있으며, ' +
      '부재 시 배송기사가 재방문 일정을 안내드립니다.</p>';
});
</script>
</body>
</html>
